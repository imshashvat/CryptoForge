# ============================================================
# CryptoForge — application-prod.properties (PRODUCTION)
# Activated by: SPRING_PROFILES_ACTIVE=prod
# ALL values come from environment variables — no fallbacks!
# ============================================================

# -------- Database (Render / Railway / PlanetScale) --------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — tuned for free-tier hosts (fewer connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# keepaliveTime: ping idle connections every 60s so Render never drops them silently
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# -------- JPA/Hibernate --------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------- JSP --------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# -------- Security --------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# -------- Market Data --------
app.market.coingecko.url=https://api.coingecko.com/api/v3
app.market.poll-interval-ms=30000
app.market.enabled=true

# -------- Actuator --------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -------- Logging (reduce verbosity in production) --------
logging.level.com.nietproject=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# -------- Server --------
# Render injects PORT env var
server.port=${PORT:8080}
