# ============================================================
# CryptoForge — application.properties (LOCAL DEVELOPMENT)
# ============================================================

spring.application.name=CryptoForge
server.port=8080

# -------- Database (LOCAL — MySQL 8 on port 3306) --------
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/cryptoforge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (auto-configured by Spring Boot — Unit IV talking point)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -------- JPA/Hibernate (Unit V) --------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------- JSP View Resolver (Unit II) --------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# -------- Security --------
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# JWT secret (must be 256-bit / 32 chars minimum)
app.jwt.secret=${JWT_SECRET:CryptoForge2024SecretKeyForJWTSigning!}
app.jwt.expiration-ms=86400000

# -------- Market Data --------
app.market.coingecko.url=https://api.coingecko.com/api/v3
app.market.poll-interval-ms=15000
app.market.enabled=true

# -------- Actuator (health check for Render deployment) --------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=CryptoForge
info.app.description=Online Cryptocurrency Exchange Platform
info.app.version=1.0.0

# -------- Logging (Unit IV — Spring Boot logging, named in syllabus) --------
logging.level.com.nietproject=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
