# ============================================================
# CryptoForge — application-h2.properties (ZERO-SETUP LOCAL DEV)
# Activated by: SPRING_PROFILES_ACTIVE=h2
# ============================================================

spring.application.name=CryptoForge
server.port=8080

# -------- Database (Embedded H2 in MySQL mode) --------
spring.datasource.url=jdbc:h2:mem:cryptoforge;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------- JPA/Hibernate --------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# -------- JSP View Resolver --------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# -------- Security --------
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:CryptoForge2024SecretKeyForJWTSigning!}
app.jwt.expiration-ms=86400000

# -------- Market Data --------
app.market.coingecko.url=https://api.coingecko.com/api/v3
app.market.poll-interval-ms=15000
app.market.enabled=true

# -------- Logging --------
logging.level.com.nietproject=INFO
logging.level.org.hibernate.SQL=WARN
